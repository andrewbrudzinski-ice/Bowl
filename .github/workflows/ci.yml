name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, store-callback check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:callbacks
      - run: npm run build
        env:
          SESSION_SECRET: ci-build-only

  test-file:
    name: Tests (file store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The same suite on Postgres semantics. BOWL_VERIFY_SCOPE re-runs every scoped load on full tables and fails on any difference.
  test-pglite:
    name: Tests (embedded Postgres, scope verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pg
        env:
          BOWL_VERIFY_SCOPE: "1"

  test-postgres:
    name: Tests (PostgreSQL 16, scope verification)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pg:server
        env:
          BOWL_VERIFY_SCOPE: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
